<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ankesh Software Solutions | Support</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#6b7488; --brand:#2f5bea; --green:#1f9d55; --red:#d64545;
          --a-bg:#fff; --u-bg:#2f5bea; --u-text:#fff; --line:#e3e7f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1420; --card:#171d2c; --text:#e8ecf6; --muted:#8a94ab; --a-bg:#1f2638; --line:#2a3249; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; background: var(--bg); color: var(--text);
         display: flex; flex-direction: column; }
  header { background: var(--brand); color: #fff; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
           display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; flex: none; }
  .titles { flex: 1; min-width: 0; }
  .name { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 12px; opacity: .85; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.2); display: none; }
  .pill.on { display: block; }
  select { border: 0; border-radius: 8px; padding: 6px 8px; font-size: 13px; background: #fff; color: #1c2333; max-width: 150px; }
  select:disabled { opacity: .5; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-width: 820px; width: 100%; margin: 0 auto; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row.u { justify-content: flex-end; }
  .av { width: 30px; height: 30px; border-radius: 50%; background: var(--brand); display: grid; place-items: center; flex: none; }
  .bub { max-width: 80%; padding: 10px 14px; border-radius: 16px; background: var(--a-bg); border: 1px solid var(--line); line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
  .row.u .bub { background: var(--u-bg); color: var(--u-text); border-color: transparent; }
  .row.live .bub { opacity: .75; }
  .ts { font-size: 10px; color: var(--muted); margin-top: 4px; }
  .row.u .ts { color: rgba(255,255,255,.75); }
  .note { text-align: center; font-size: 12px; color: var(--muted); }
  .dots i { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--muted); animation: b 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
  .hero { text-align: center; margin: 24px 0 8px; }
  .hero .ic { width: 64px; height: 64px; border-radius: 50%; background: var(--brand); margin: 0 auto 12px; display: grid; place-items: center; }
  .hero .t { font-size: 20px; font-weight: 700; } .hero .s { color: var(--muted); font-size: 14px; margin-top: 4px; }
  #quick { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #quick small { color: var(--muted); }
  #quick button { width: 100%; max-width: 420px; padding: 10px 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 14px; cursor: pointer; }
  #quick button:hover { border-color: var(--brand); }
  footer { background: var(--card); border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
  #composer { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
  #msg { flex: 1; min-width: 0; height: 46px; padding: 0 18px; border-radius: 24px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 16px; outline: none; }
  #msg:focus { border-color: var(--brand); }
  #msg:disabled { opacity: .7; }
  .icon { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; color: #fff; transition: transform .1s; }
  .icon:active { transform: scale(.94); }
  .icon svg { width: 22px; height: 22px; fill: currentColor; }
  .icon.action { background: var(--green); }
  .icon.action.end { background: var(--red); animation: pulse 1.6s infinite; }
  .icon:disabled { opacity: .45; cursor: not-allowed; }
  #endBtn { background: transparent; color: var(--muted); }
  #endBtn:hover { color: var(--red); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(214,69,69,.5); } 70%,100% { box-shadow: 0 0 0 12px rgba(214,69,69,0); } }
  [hidden] { display: none !important; }
  #toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90%; text-align: center; }
  #toast.on { opacity: 1; }
  #problem { margin: 40px auto; max-width: 520px; padding: 16px; border-radius: 12px; background: #fdecec; color: #8a1f1f; }
/* desktop: icon hidden, the label wrapper does not affect layout */
  .langwrap { display: contents; }
  .langico { display: none; }

  @media (max-width: 640px) {
    /* language: round globe icon, the native picker opens when you tap it */
    .langwrap { display: grid; position: relative; place-items: center; flex: none;
                width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.2); }
    .langico { display: block; width: 22px; height: 22px; fill: #fff; pointer-events: none; }
    .langwrap:has(select:disabled) .langico { opacity: .4; }
    .langwrap select, .langwrap select:disabled {
      position: absolute; inset: 0; width: 100%; max-width: none; height: 100%;
      opacity: 0; font-size: 16px; cursor: pointer;
    }

    /* status: icon only (the text stays available as a tooltip) */
    .pill { font-size: 0; padding: 0; width: 34px; height: 34px; flex: none; }
    .pill.on { display: grid; place-items: center; }
    .pill::before { font-size: 17px; line-height: 1; padding: 5px; color:#fff }
    .pill[data-kind="speak"]::before  { content: "🔊"; }
    .pill[data-kind="listen"]::before { content: "🎤"; }
    .pill[data-kind="think"]::before  { content: "💭"; }
    .pill.on { animation: pill 1.4s ease-in-out infinite; }
    @keyframes pill { 50% { opacity: .55; } }
  }

</style>
</head>
<body>
<header>
  <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M12 1c-4.97 0-9 4.03-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h4v1h-7v2h6c1.66 0 3-1.34 3-3V10c0-4.97-4.03-9-9-9z"/></svg></div>
  <div class="titles"><div class="name">Ankesh Software Solutions</div><div class="sub" id="sub">CCMS Support Assistant</div></div>
  <div class="pill" id="status"></div>
 <label class="langwrap" title="Language">
  <svg class="langico" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.92 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.99 7.99 0 0 1 5.08 16zm2.95-8H5.08a7.99 7.99 0 0 1 4.33-3.56A15.65 15.65 0 0 0 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.1-.66-.16-1.32-.16-2s.06-1.35.16-2h4.68c.09.65.16 1.32.16 2s-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
  <select id="lang" aria-label="Language"></select>
</label>
</header>

<main id="chat">
  <div id="welcome">
    <div class="hero"><div class="ic"><svg width="32" height="32" viewBox="0 0 24 24" fill="#fff"><path d="M12 1c-4.97 0-9 4.03-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h4v1h-7v2h6c1.66 0 3-1.34 3-3V10c0-4.97-4.03-9-9-9z"/></svg></div>
      <div class="t">How can we help you today?</div>
      <div class="s">Type a message to chat, or tap the microphone to talk. Change the language at the top.</div></div>
  </div>
  <div id="quick" hidden></div>
</main>

<footer>
  <form id="composer" autocomplete="off">
    <button type="button" id="endBtn" class="icon" title="End chat" aria-label="End chat" hidden></button>
    <input id="msg" placeholder="Type a message" maxlength="1000" enterkeyhint="send">
    <button type="button" id="actionBtn" class="icon action" aria-label="Start voice call"></button>
  </form>
</footer>
<div id="toast"></div>

<script>
"use strict";
/* ---------------------------------------------------------------------------------------------
   How it works (all audio stays in the browser, only TEXT travels to the server):
     Call:  speak greeting -> listen (SpeechRecognition) -> send text -> sentences stream back ->
            each sentence is shown and spoken (speechSynthesis) as soon as it arrives -> listen again
     Chat:  type -> send text -> sentences stream back and are shown as they arrive
   Sections:  1 state  2 screen helpers  3 voice out  4 voice in  5 server socket  6 session  7 start-up
   --------------------------------------------------------------------------------------------- */

// ---------------------------------------------------------------- 1. STATE
const $ = (s) => document.querySelector(s);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;   // Chrome / Edge / Android; not Firefox
const S = {
  cfg: null, lang: null, mode: "idle",        // idle | call | chat
  ws: null, wsOpen: false,
  queue: [], speaking: false, cancelSpeak: null,       // sentences waiting to be shown / spoken
  turnPending: false, turnDone: true, endInfo: null,   // is a reply still arriving?
  liveRow: null, liveBody: null, dotsRow: null, userLive: null,
  rec: null, listenStart: 0, sawSpeech: false,
  firstQuestion: null,
};

// ---------------------------------------------------------------- 2. SCREEN HELPERS
function toast(text) {
  const t = $("#toast"); t.textContent = text; t.classList.add("on");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("on"), 3500);
}
function setStatus(text) {
  const p = $("#status");
  p.textContent = text || "";
  p.title = text || "";
  p.setAttribute("aria-label", text || "");
  p.dataset.kind = /speak/i.test(text || "") ? "speak" : /listen/i.test(text || "") ? "listen" : "think";
  p.classList.toggle("on", !!text);
}


function scrollDown() { const c = $("#chat"); c.scrollTop = c.scrollHeight; }
function stamp() { return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }

function makeRow(role, text) {                       // role: a (agent) | u (user)
  const row = document.createElement("div"); row.className = "row " + role;
  if (role === "a") { const av = document.createElement("div"); av.className = "av"; av.textContent = "🎧"; row.appendChild(av); }
  const bub = document.createElement("div"); bub.className = "bub";
  const body = document.createElement("div"); body.textContent = text || "";    // textContent: no HTML injection
  bub.appendChild(body); row.appendChild(bub);
  $("#chat").insertBefore(row, $("#quick"));
  scrollDown();
  return { row, body, bub };
}
function addTs(bub) { const d = document.createElement("div"); d.className = "ts"; d.textContent = stamp(); bub.appendChild(d); }
function addMessage(role, text) { const m = makeRow(role, text); addTs(m.bub); }
function addNote(text) {
  const n = document.createElement("div"); n.className = "note"; n.textContent = text;
  $("#chat").insertBefore(n, $("#quick")); scrollDown();
}
function showDots() {
  hideDots();
  const m = makeRow("a", ""); m.body.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>'; S.dotsRow = m.row;
}
function hideDots() { if (S.dotsRow) { S.dotsRow.remove(); S.dotsRow = null; } }
function showUserLive(text) {                         // the words being heard right now
  if (!text) { clearUserLive(); return; }
  if (!S.userLive) { const m = makeRow("u", text); m.row.classList.add("live"); S.userLive = m; }
  S.userLive.body.textContent = text; scrollDown();
}
function clearUserLive() { if (S.userLive) { S.userLive.row.remove(); S.userLive = null; } }

// ---------------------------------------------------------------- 2b. MESSAGE BAR (WhatsApp style)
// Idle: empty box = mic (starts a voice call), text typed = send (starts a chat).  Chat: send.  Call: red end-call button.
const ICON = {
  mic:  '<svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>',
  send: '<svg viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>',
  end:  '<svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>',
  close:'<svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>',
};
function updateAction() {
  const b = $("#actionBtn"), has = $("#msg").value.trim().length > 0, m = S.mode;
  let icon = ICON.mic, cls = "icon action", label = "Start voice call", disabled = false;
  if (m === "call") { icon = ICON.end; cls = "icon action end"; label = "End call"; }
  else if (has || m === "chat") { icon = ICON.send; label = "Send"; disabled = m === "chat" && (!has || S.turnPending); }
  b.className = cls; b.innerHTML = icon; b.title = label; b.setAttribute("aria-label", label); b.disabled = disabled;
}

function renderMode() {
  const m = S.mode;
  $("#endBtn").hidden = m !== "chat";
  $("#msg").disabled = m === "call";
  $("#msg").placeholder = m === "call" ? "On call..." : "Type a message";
  if (m === "call") $("#msg").value = "";
  $("#lang").disabled = m !== "idle";
  updateAction();
  $("#welcome").hidden = !($("#chat").querySelectorAll(".row,.note").length === 0 && m === "idle");
  renderQuick();
  if (m === "chat") $("#msg").focus();
}
function renderQuick() {
  const box = $("#quick");
  const asked = !!$("#chat .row.u");
  const visible = (S.mode === "idle" && $("#chat").querySelectorAll(".row,.note").length === 0) || (S.mode === "chat" && !asked && !S.turnPending && !S.firstQuestion);
  box.hidden = !visible; if (!visible) return;
  const list = S.cfg.quick_questions[S.lang] || S.cfg.quick_questions[S.cfg.default_language] || [];
  box.innerHTML = "<small>Quick questions</small>";
  list.forEach((q) => { const b = document.createElement("button"); b.textContent = q; b.onclick = () => askQuick(q); box.appendChild(b); });
}

// ---------------------------------------------------------------- 3. VOICE OUT (text -> speech, in the browser)
function normLang(l) { return (l || "").replace("_", "-").toLowerCase(); }
function pickVoice(code) {
  const want = normLang(code), prefix = want.split("-")[0];
  const voices = speechSynthesis.getVoices();
  return voices.find((v) => normLang(v.lang) === want) || voices.find((v) => normLang(v.lang).split("-")[0] === prefix) || null;
}
function speakItem(item) {                          // resolves when the sentence has been spoken (or cancelled)
  return new Promise((resolve) => {
    let finished = false;
    const done = () => { if (!finished) { finished = true; S.cancelSpeak = null; resolve(); } };
    const L = S.cfg.languages[S.lang];
    const voice = "speechSynthesis" in window ? pickVoice(L.stt) : null;
    if (voice) {
      const u = new SpeechSynthesisUtterance(item.say);
      u.voice = voice; u.lang = voice.lang; u.onend = done; u.onerror = done;
      S.cancelSpeak = () => { speechSynthesis.cancel(); done(); };
      speechSynthesis.speak(u);
    } else {                                         // no voice for this language in this browser: use the server voice
      const a = new Audio("/api/tts?lang=" + encodeURIComponent(L.tts) + "&text=" + encodeURIComponent(item.say));
      a.onended = done; a.onerror = () => { if (!speakItem.warned) { speakItem.warned = true; toast("No voice available for " + S.lang + ": showing text only."); } done(); };
      S.cancelSpeak = () => { a.pause(); done(); };
      a.play().catch(() => a.onerror());
    }
  });
}

// ---------------------------------------------------------------- 4. VOICE IN (speech -> text, in the browser)
function listen() {
  if (S.mode !== "call") return;
  setStatus("Listening... please speak");
  S.listenStart = Date.now(); S.sawSpeech = false;
  startRecognition();
}
function startRecognition() {
  if (S.mode !== "call") return;
  const rec = new SR(); S.rec = rec;
  rec.lang = S.cfg.languages[S.lang].stt; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let finalText = "", interim = "";
  rec.onspeechstart = () => { S.sawSpeech = true; };
  rec.onresult = (e) => {
    interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    showUserLive((finalText + interim).trim());
  };
  rec.onerror = (e) => {
    if (e.error === "no-speech" || e.error === "aborted") return;            // normal: handled in onend
    const reasons = { "not-allowed": "Microphone permission was denied.", "service-not-allowed": "Speech recognition is not allowed here.",
                      "audio-capture": "No microphone was found.", "network": "The speech service could not be reached." };
    endSession("Call stopped: " + (reasons[e.error] || "speech error (" + e.error + ")"));
  };
  rec.onend = () => {
    if (S.rec !== rec || S.mode !== "call") return;                          // already ended / replaced
    S.rec = null;
    const text = (finalText || interim).trim();
    clearUserLive();
    if (text) sendUser(text);
    else if (S.sawSpeech) sendControl("unheard");                           // speech heard, not understood
    else if (Date.now() - S.listenStart >= S.cfg.silence_wait * 1000) sendControl("silence");   // caller said nothing
    else startRecognition();                                                 // Chrome stops early: keep listening
  };
  try { rec.start(); } catch (err) { console.warn(err); setTimeout(startRecognition, 300); }
}
function stopRecognition() {
  if (S.rec) { const r = S.rec; S.rec = null; r.onend = null; r.onerror = null; try { r.abort(); } catch (e) {} }
}

// ---------------------------------------------------------------- 5. SERVER SOCKET (text only)
function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  S.ws = ws;
  ws.onopen = () => { S.wsOpen = true; beginTurn(); ws.send(JSON.stringify({ type: "start", lang: S.lang })); };
  ws.onmessage = (e) => handleServer(JSON.parse(e.data));
  ws.onclose = () => { S.wsOpen = false; if (S.ws === ws && S.mode !== "idle") endSession("Connection lost"); };
}
function send(obj) { if (S.ws && S.wsOpen) S.ws.send(JSON.stringify(obj)); }

function beginTurn() {                              // a reply is about to arrive
  S.turnPending = true; S.turnDone = false; S.endInfo = null; S.liveRow = null; S.liveBody = null;
  showDots(); setStatus("Thinking...");
  renderQuick(); updateAction();
}
function sendUser(text) { addMessage("u", text); beginTurn(); send({ type: "text", text }); }
function sendControl(type) { beginTurn(); send({ type }); }

function handleServer(m) {
  if (m.type === "sentence") { S.queue.push({ text: m.text, say: m.say }); pump(); }
  else if (m.type === "end") { S.turnDone = true; S.endInfo = m; if (m.saved) toast("Your request has been recorded."); pump(); }
  else if (m.type === "error") {
    hideDots(); S.turnPending = false; updateAction();
    if (S.mode === "call" || /Could not start/.test(m.message)) endSession(m.message);
    else { addNote(m.message); }
  }
}

// Show (and in call mode speak) the sentences one after another as they arrive.
function pump() {
  if (S.speaking) return;
  const item = S.queue.shift();
  if (item) {
    hideDots();
    if (!S.liveRow) { const m = makeRow("a", ""); m.row.classList.add("live"); S.liveRow = m; }
    S.liveRow.body.textContent += (S.liveRow.body.textContent ? " " : "") + item.text; scrollDown();
    if (S.mode === "call") {
      S.speaking = true; setStatus("Agent is speaking...");
      speakItem(item).then(() => { S.speaking = false; pump(); });
    } else pump();
    return;
  }
  if (S.turnDone && S.turnPending) finishTurn();
}
function finishTurn() {
  S.turnPending = false; hideDots();
  if (S.liveRow) { S.liveRow.row.classList.remove("live"); addTs(S.liveRow.bub); S.liveRow = null; }
  const info = S.endInfo || {};
  if (info.ended) { endSession(S.mode === "call" ? "Call ended" : "Chat ended"); return; }
  if (S.firstQuestion) { const q = S.firstQuestion; S.firstQuestion = null; sendUser(q); return; }
  if (S.mode === "call") listen(); else { setStatus(""); $("#msg").focus(); }
  renderQuick(); updateAction();
}

// ---------------------------------------------------------------- 6. SESSION (start / end)
function startSession(mode, firstQuestion) {
  if (S.mode !== "idle") return;
  if (mode === "call" && !SR) { toast("Voice calls need Chrome or Edge. You can use Chat instead."); return; }
  document.querySelectorAll("#chat .row, #chat .note").forEach((n) => n.remove());
  Object.assign(S, { mode, queue: [], speaking: false, firstQuestion: mode === "chat" ? (firstQuestion || null) : null });
  renderMode();
  if (mode === "call" && S.lang !== S.cfg.default_language) toast("Speaking " + S.lang + " (voice depends on your device).");
  connect();
}
function endSession(note) {
  if (S.mode === "idle") return;
  const ws = S.ws; S.ws = null; S.wsOpen = false;
  S.mode = "idle"; S.queue = []; S.speaking = false; S.turnPending = false; S.firstQuestion = null;
  stopRecognition(); clearUserLive(); hideDots();
  if (S.cancelSpeak) S.cancelSpeak();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (S.liveRow) { if (S.liveRow.body.textContent) { S.liveRow.row.classList.remove("live"); addTs(S.liveRow.bub); } else S.liveRow.row.remove(); S.liveRow = null; }
  if (ws) { try { ws.send(JSON.stringify({ type: "end" })); ws.close(); } catch (e) {} }
  setStatus(""); addNote(note); renderMode();
}
function askQuick(q) {
  if (S.mode === "idle") startSession("chat", q);
  else if (S.mode === "chat" && !S.turnPending) sendUser(q);
}

// ---------------------------------------------------------------- 7. START-UP
async function init() {
  let cfg;
  try { cfg = await (await fetch("/api/config")).json(); }
  catch (e) { $("#chat").innerHTML = '<div id="problem">Could not reach the server. Please reload.</div>'; return; }
  if (cfg.problem) { $("#chat").innerHTML = ""; const d = document.createElement("div"); d.id = "problem"; d.textContent = cfg.problem; $("#chat").appendChild(d); $("#composer").hidden = true; return; }
  S.cfg = cfg; S.lang = cfg.default_language;
  const sel = $("#lang");
  Object.entries(cfg.languages).forEach(([name, l]) => { const o = document.createElement("option"); o.value = name; o.textContent = l.label; sel.appendChild(o); });
  sel.value = S.lang;
  sel.onchange = () => { S.lang = sel.value; $("#sub").textContent = "CCMS Support Assistant · " + cfg.languages[S.lang].label; renderQuick(); };
  $("#sub").textContent = "CCMS Support Assistant · " + cfg.languages[S.lang].label;
  const msg = $("#msg");
  if (!SR) $("#actionBtn").title = "Voice calls need Chrome or Edge";
  msg.oninput = updateAction;
  function act() {                                   // the round button (and Enter when there is text)
    const text = msg.value.trim();
    if (S.mode === "call") { endSession("Call ended"); return; }
    if (S.mode === "idle") {
      if (text) { msg.value = ""; startSession("chat", text); } else startSession("call");   // text = chat, empty = voice
      return;
    }
    if (text && !S.turnPending) { msg.value = ""; sendUser(text); updateAction(); }
  }
  $("#actionBtn").onclick = act;
  $("#composer").onsubmit = (e) => { e.preventDefault(); if (msg.value.trim()) act(); };   // Enter never starts a call
  $("#endBtn").innerHTML = ICON.close;
  $("#endBtn").onclick = () => endSession("Chat ended");
  if ("speechSynthesis" in window) speechSynthesis.getVoices();      // voices load lazily in some browsers
  renderMode();
}
init();
</script>
